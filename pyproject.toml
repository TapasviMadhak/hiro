[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiro"
version = "0.1.0"
description = "Claude Code-grade terminal AI coding assistant with multi-provider support and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "terminal", "coding", "mcp", "cybersecurity", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Terminals",
]

dependencies = [
    "prompt_toolkit>=3.0.47",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "anyio>=4.4.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "pydantic>=2.7.0",
    "pygments>=2.18.0",
    "aiofiles>=23.2.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "pathspec>=0.12.1",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.47.0"]
google = ["google-genai>=2.0.0", "google-generativeai>=0.8.0"]
groq = ["groq>=0.11.0"]
all = ["anthropic>=0.34.0", "openai>=1.47.0", "google-genai>=2.0.0", "google-generativeai>=0.8.0", "groq>=0.11.0"]

[project.scripts]
hiro = "hiro.main:main"
h = "hiro.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hiro*"]

[tool.setuptools.package-data]
"hiro" = ["py.typed", "*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
